plugins {
    id 'net.fabricmc.fabric-loom'
    id 'io.github.flemmli97.multiloader.platform-fabric'
}

loom {
    runs {
        client {
            vmArgs "-XX:+AllowEnhancedClassRedefinition"
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly("me.lucko:fabric-permissions-api:${fabric_permissions_api}")
}